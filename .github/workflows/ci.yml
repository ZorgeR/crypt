name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the full suite (Redis-backed server tests and Playwright e2e) on any
  # branch from the Actions tab or `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @crypt.fyi/web exec playwright install chromium --with-deps

      - name: E2E (create/read/burn, password, streamed files under production CSP)
        run: pnpm test:e2e
        env:
          CI: true
          VITE_API_URL: http://localhost:4322
          REDIS_URL: redis://127.0.0.1:6379

      # Traces (retries run with trace: on-first-retry) and screenshots are the
      # only way to see what the browser did in a failed run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
